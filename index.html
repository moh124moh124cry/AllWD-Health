<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ التحاليل الذكي | Larousse Médical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .tab-inactive { background-color: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
        <div class="flex items-center gap-4 border-b pb-5 mb-6">
            <div class="bg-blue-600 text-white p-3.5 rounded-xl shadow-md">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">المحلل الطبي الشامل</h1>
                <p class="text-sm text-gray-500 mt-1">النتائج مخصصة حسب العمر والجنس (Larousse Médical)</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">عمر المريض (سنة)</label>
                <input type="number" id="patientAge" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-white" placeholder="مثال: 35" value="30">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">الجنس</label>
                <select id="patientGender" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="male">ذكر</option>
                    <option value="female">أنثى</option>
                </select>
            </div>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="switchTab('image')" id="tabImage" class="flex-1 py-2.5 rounded-lg font-bold border tab-active transition">مسح صورة التحليل</button>
            <button onclick="switchTab('text')" id="tabText" class="flex-1 py-2.5 rounded-lg font-bold border tab-inactive transition">إدخال القيم يدوياً</button>
        </div>

        <div id="sectionImage" class="mb-6 border-2 border-dashed border-blue-300 bg-blue-50/30 rounded-2xl p-8 text-center hover:bg-blue-50 transition-colors cursor-pointer" onclick="document.getElementById('reportImage').click()">
            <input type="file" id="reportImage" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            <svg class="w-12 h-12 mx-auto text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <p id="uploadText" class="text-base font-bold text-blue-900">اضغط لرفع صورة التقرير الطبي</p>
        </div>

        <div id="sectionText" class="mb-6 hidden">
            <textarea id="manualInput" rows="4" class="w-full border-gray-300 rounded-xl p-4 border focus:ring-blue-500 focus:border-blue-500 bg-gray-50" placeholder="اكتب نتائج التحليل هنا... &#10;مثال: سكر 1.9، كوليسترول 1.8"></textarea>
            <button onclick="handleManualSubmit()" class="w-full mt-3 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg transition shadow">تحليل القيم المكتوبة</button>
        </div>

        <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center py-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <p class="text-gray-600 font-medium text-center">جاري تقييم النتائج...<br><span class="text-sm text-gray-400">المرجع: Larousse Médical</span></p>
        </div>

        <div id="reportSection" class="mt-8 hidden">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-3 mb-5 flex justify-between items-center">
                <span>التقرير الطبي المفصل</span>
                <span id="patientSummary" class="text-sm font-normal bg-blue-100 text-blue-800 px-3 py-1 rounded-full"></span>
            </h2>
            <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const tabImage = document.getElementById('tabImage');
            const tabText = document.getElementById('tabText');
            const sectionImage = document.getElementById('sectionImage');
            const sectionText = document.getElementById('sectionText');

            if (tab === 'image') {
                tabImage.className = 'flex-1 py-2.5 rounded-lg font-bold border tab-active transition';
                tabText.className = 'flex-1 py-2.5 rounded-lg font-bold border tab-inactive transition';
                sectionImage.classList.remove('hidden');
                sectionText.classList.add('hidden');
            } else {
                tabText.className = 'flex-1 py-2.5 rounded-lg font-bold border tab-active transition';
                tabImage.className = 'flex-1 py-2.5 rounded-lg font-bold border tab-inactive transition';
                sectionText.classList.remove('hidden');
                sectionImage.classList.add('hidden');
            }
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1500; const MAX_HEIGHT = 1500;
                    let width = img.width; let height = img.height;
                    if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                    else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                    callback(compressedBase64);
                };
            };
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            startLoading();
            compressImage(file, (base64Data) => {
                analyzeData({ imageBase64: base64Data, mimeType: 'image/jpeg' });
            });
        }

        function handleManualSubmit() {
            const text = document.getElementById('manualInput').value.trim();
            if (!text) return alert("يرجى كتابة بعض النتائج أولاً");
            startLoading();
            analyzeData({ manualText: text });
        }

        function startLoading() {
            document.getElementById('reportSection').classList.add('hidden');
            document.getElementById('loadingIndicator').classList.remove('hidden');
        }

        async function analyzeData(payload) {
            payload.age = document.getElementById('patientAge').value;
            payload.gender = document.getElementById('patientGender').value;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // عرض الخطأ الفعلي القادم من الخادم
                if (!response.ok || data.error) {
                    throw new Error(data.error || 'فشل الاتصال بالخادم.');
                }
                
                renderResults(data, payload.age, payload.gender);

            } catch (error) {
                console.error(error);
                // التنبيه الآن سيعرض السبب الحقيقي بدلاً من "حدث خطأ"
                alert("سبب الخطأ: " + error.message);
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function renderResults(dataArray, age, gender) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';
            
            const genderText = gender === 'male' ? 'ذكر' : 'أنثى';
            document.getElementById('patientSummary').innerText = `المريض: ${genderText} | العمر: ${age} سنة`;

            dataArray.forEach(item => {
                let colorClass = 'text-green-700 bg-green-50 border-green-200';
                if (item.status === 'مرتفع') colorClass = 'text-red-700 bg-red-50 border-red-200';
                if (item.status === 'منخفض' || item.status === 'غير طبيعي') colorClass = 'text-blue-700 bg-blue-50 border-blue-200';

                const cardHTML = `
                    <div class="p-4 border rounded-xl ${colorClass} flex flex-col justify-between shadow-sm">
                        <div class="flex justify-between items-start mb-2 border-b border-white/40 pb-2">
                            <span class="font-bold text-lg">${item.name || 'غير معروف'}</span>
                            <span class="font-bold border px-2 py-1 rounded bg-white shadow-sm" dir="ltr">${item.value || ''} ${item.unit || ''}</span>
                        </div>
                        <div class="text-sm mt-1 leading-relaxed">
                            <div class="flex items-center gap-1 mb-1">
                                <strong>الحالة:</strong> 
                                <span class="font-semibold bg-white/50 px-2 py-0.5 rounded text-xs">${item.status || 'غير محدد'}</span>
                            </div>
                            <p class="opacity-95 mb-2">${item.explanation || 'لا يوجد تفسير'}</p>
                            <div class="text-xs opacity-75 bg-white/40 inline-block px-2 py-1 rounded" dir="ltr">Range: ${item.range || 'N/A'}</div>
                        </div>
                    </div>
                `;
                resultsContainer.innerHTML += cardHTML;
            });

            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('reportSection').classList.remove('hidden');
            if(document.getElementById('uploadText')) document.getElementById('uploadText').innerText = 'اضغط لرفع صورة التقرير الطبي';
        }
    </script>
</body>
</html>
